# GitLab Pages - Deploy da Nova BCCI (Vite + React)
# O site será publicado em: https://bcci-nav-75a666.gitlab.io/

stages:
  - build
  - deploy

variables:
  VITE_BASE_PATH: "/"

build:
  stage: build
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
